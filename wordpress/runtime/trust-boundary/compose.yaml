name: newsroom-trust-boundary

services:
  db:
    image: mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${RUNTIME_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${RUNTIME_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1-php8.2-apache@sha256:75c755113d8644a08519270d77e0c8bd14b7bea23910e3d165056870093869a2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEWSROOM_TEST_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      NEWSROOM_BRIDGE_USER_ID: ${NEWSROOM_BRIDGE_USER_ID:-}
      NEWSROOM_TRUST_BOUNDARY_SERVICE_USER_ID: ${NEWSROOM_BRIDGE_USER_ID:-}
      NEWSROOM_HMAC_DRAFT_KEY_RING_JSON: ${NEWSROOM_HMAC_DRAFT_KEY_RING_JSON}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        if ( false !== getenv( 'NEWSROOM_BRIDGE_USER_ID' ) && '' !== getenv( 'NEWSROOM_BRIDGE_USER_ID' ) ) {
          define( 'NEWSROOM_BRIDGE_USER_ID', (int) getenv( 'NEWSROOM_BRIDGE_USER_ID' ) );
          define( 'NEWSROOM_TRUST_BOUNDARY_SERVICE_USER_ID', (int) getenv( 'NEWSROOM_TRUST_BOUNDARY_SERVICE_USER_ID' ) );
        }
        $$newsroom_hmac_draft_key_ring = json_decode( (string) getenv( 'NEWSROOM_HMAC_DRAFT_KEY_RING_JSON' ), true );
        define( 'NEWSROOM_HMAC_DRAFT_KEYS', $$newsroom_hmac_draft_key_ring );
        unset( $$newsroom_hmac_draft_key_ring );
    volumes:
      - wp_data:/var/www/html
      - ../../newsroom-bridge:/var/www/html/wp-content/plugins/newsroom-bridge:ro
      - ./trust-boundary-shim:/var/www/html/wp-content/plugins/newsroom-trust-boundary-shim:ro

  cli:
    image: wordpress:cli@sha256:2b5e9d4d3e51909dca1aaa4732e9f5e5bf0377c2114dbd8ff39f060bff202586
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      NEWSROOM_BRIDGE_USER_ID: ${NEWSROOM_BRIDGE_USER_ID:-}
      NEWSROOM_TRUST_BOUNDARY_SERVICE_USER_ID: ${NEWSROOM_BRIDGE_USER_ID:-}
      NEWSROOM_HMAC_DRAFT_KEY_RING_JSON: ${NEWSROOM_HMAC_DRAFT_KEY_RING_JSON}
    volumes:
      - wp_data:/var/www/html
      - ../../newsroom-bridge:/var/www/html/wp-content/plugins/newsroom-bridge:ro
      - ./trust-boundary-shim:/var/www/html/wp-content/plugins/newsroom-trust-boundary-shim:ro

volumes:
  db_data:
  wp_data:
