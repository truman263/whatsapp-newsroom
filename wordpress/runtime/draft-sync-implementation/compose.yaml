name: newsroom-draft-sync-implementation

services:
  db:
    image: mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${RUNTIME_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${RUNTIME_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1-php8.2-apache@sha256:75c755113d8644a08519270d77e0c8bd14b7bea23910e3d165056870093869a2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEWSROOM_TEST_PORT}:80"
    environment: &wordpress_environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      NEWSROOM_BRIDGE_USER_ID: ${NEWSROOM_BRIDGE_USER_ID}
      NEWSROOM_BRIDGE_SERVICE_LOCKDOWN_ENABLED: ${NEWSROOM_BRIDGE_SERVICE_LOCKDOWN_ENABLED}
      NEWSROOM_BRIDGE_HMAC_ENABLED: ${NEWSROOM_BRIDGE_HMAC_ENABLED}
      NEWSROOM_BRIDGE_DRAFT_HMAC_KEYS_JSON: ${NEWSROOM_BRIDGE_DRAFT_HMAC_KEYS_JSON}
      NEWSROOM_BRIDGE_MEDIA_USER_ID: ${NEWSROOM_BRIDGE_MEDIA_USER_ID}
      NEWSROOM_BRIDGE_MEDIA_HMAC_ENABLED: ${NEWSROOM_BRIDGE_MEDIA_HMAC_ENABLED}
      NEWSROOM_BRIDGE_MEDIA_SERVICE_LOCKDOWN_ENABLED: ${NEWSROOM_BRIDGE_MEDIA_SERVICE_LOCKDOWN_ENABLED}
      NEWSROOM_BRIDGE_MEDIA_HMAC_KEYS_JSON: ${NEWSROOM_BRIDGE_MEDIA_HMAC_KEYS_JSON}
      NEWSROOM_BRIDGE_MEDIA_MAX_BYTES: ${NEWSROOM_BRIDGE_MEDIA_MAX_BYTES}
      NEWSROOM_BRIDGE_SECURITY_LOGGING_ENABLED: ${NEWSROOM_BRIDGE_SECURITY_LOGGING_ENABLED}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'NEWSROOM_BRIDGE_USER_ID', (int) getenv( 'NEWSROOM_BRIDGE_USER_ID' ) );
        $$newsroom_lockdown_flag = getenv( 'NEWSROOM_BRIDGE_SERVICE_LOCKDOWN_ENABLED' );
        define( 'NEWSROOM_BRIDGE_SERVICE_LOCKDOWN_ENABLED', '1' === $$newsroom_lockdown_flag ? true : ( '0' === $$newsroom_lockdown_flag ? false : $$newsroom_lockdown_flag ) );
        $$newsroom_hmac_flag = getenv( 'NEWSROOM_BRIDGE_HMAC_ENABLED' );
        define( 'NEWSROOM_BRIDGE_HMAC_ENABLED', '1' === $$newsroom_hmac_flag ? true : ( '0' === $$newsroom_hmac_flag ? false : $$newsroom_hmac_flag ) );
        define( 'NEWSROOM_BRIDGE_DRAFT_HMAC_KEYS_JSON', (string) getenv( 'NEWSROOM_BRIDGE_DRAFT_HMAC_KEYS_JSON' ) );
        define( 'NEWSROOM_BRIDGE_MEDIA_USER_ID', (int) getenv( 'NEWSROOM_BRIDGE_MEDIA_USER_ID' ) );
        $$newsroom_media_lockdown = getenv( 'NEWSROOM_BRIDGE_MEDIA_SERVICE_LOCKDOWN_ENABLED' );
        define( 'NEWSROOM_BRIDGE_MEDIA_SERVICE_LOCKDOWN_ENABLED', '1' === $$newsroom_media_lockdown ? true : ( '0' === $$newsroom_media_lockdown ? false : $$newsroom_media_lockdown ) );
        $$newsroom_media_hmac = getenv( 'NEWSROOM_BRIDGE_MEDIA_HMAC_ENABLED' );
        define( 'NEWSROOM_BRIDGE_MEDIA_HMAC_ENABLED', '1' === $$newsroom_media_hmac ? true : ( '0' === $$newsroom_media_hmac ? false : $$newsroom_media_hmac ) );
        define( 'NEWSROOM_BRIDGE_MEDIA_HMAC_KEYS_JSON', (string) getenv( 'NEWSROOM_BRIDGE_MEDIA_HMAC_KEYS_JSON' ) );
        define( 'NEWSROOM_BRIDGE_MEDIA_MAX_BYTES', (int) getenv( 'NEWSROOM_BRIDGE_MEDIA_MAX_BYTES' ) );
        $$newsroom_logging_flag = getenv( 'NEWSROOM_BRIDGE_SECURITY_LOGGING_ENABLED' );
        define( 'NEWSROOM_BRIDGE_SECURITY_LOGGING_ENABLED', '1' === $$newsroom_logging_flag ? true : ( '0' === $$newsroom_logging_flag ? false : $$newsroom_logging_flag ) );
        unset( $$newsroom_lockdown_flag, $$newsroom_hmac_flag, $$newsroom_logging_flag, $$newsroom_media_lockdown, $$newsroom_media_hmac );
    volumes:
      - wp_data:/var/www/html
      - ../../newsroom-bridge:/var/www/html/wp-content/plugins/newsroom-bridge:ro
      - ./fixtures/newsroom-draft-sync-fault-harness.php:/var/www/html/wp-content/mu-plugins/newsroom-draft-sync-fault-harness.php:ro
      - ./fixtures/newsroom-draft-auth-observer.php:/var/www/html/wp-content/mu-plugins/newsroom-draft-auth-observer.php:ro

  cli:
    image: wordpress:cli@sha256:2b5e9d4d3e51909dca1aaa4732e9f5e5bf0377c2114dbd8ff39f060bff202586
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    environment: *wordpress_environment
    volumes:
      - wp_data:/var/www/html
      - ../../newsroom-bridge:/var/www/html/wp-content/plugins/newsroom-bridge:ro
      - ./fixtures/newsroom-draft-sync-fault-harness.php:/var/www/html/wp-content/mu-plugins/newsroom-draft-sync-fault-harness.php:ro
      - ./fixtures/newsroom-draft-auth-observer.php:/var/www/html/wp-content/mu-plugins/newsroom-draft-auth-observer.php:ro

volumes:
  db_data:
  wp_data:
